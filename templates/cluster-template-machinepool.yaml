apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  labels:
    cluster.x-k8s.io/cluster-name: "${CLUSTER_NAME}"
  name: "${CLUSTER_NAME}"
  namespace: "${NAMESPACE}"
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - ${POD_CIDR:="192.168.0.0/16"}
    serviceDomain: ${SERVICE_DOMAIN:="cluster.local"}
    services:
      cidrBlocks:
        - ${SERVICE_CIDR:="10.128.0.0/12"}
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: OCICluster
    name: "${CLUSTER_NAME}"
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: KubeadmControlPlane
    name: "${CLUSTER_NAME}-control-plane"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta3
kind: OCICluster
metadata:
  namespace: "${NAMESPACE}"
  labels:
    cluster.x-k8s.io/cluster-name: "${CLUSTER_NAME}"
  name: "${CLUSTER_NAME}"
spec:
  compartmentId: "${OCI_COMPARTMENT_ID}"
---
kind: KubeadmControlPlane
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
metadata:
  name: "${CLUSTER_NAME}-control-plane"
  namespace: "${NAMESPACE}"
spec:
  version: "${KUBERNETES_VERSION}"
  replicas: ${CONTROL_PLANE_MACHINE_COUNT}
  machineTemplate:
    spec:
      infrastructureRef:
        kind: OCIMachineTemplate
        apiGroup: infrastructure.cluster.x-k8s.io
        name: "${CLUSTER_NAME}-control-plane"
  kubeadmConfigSpec:
    clusterConfiguration:
      apiServer:
        certSANs: [localhost, 127.0.0.1]
    initConfiguration:
      nodeRegistration:
        criSocket: /var/run/containerd/containerd.sock
        kubeletExtraArgs:
          - name: cloud-provider
            value: external
          - name: provider-id
            value: 'oci://{{ ds["id"] }}'
    joinConfiguration:
      nodeRegistration:
        criSocket: /var/run/containerd/containerd.sock
        kubeletExtraArgs:
          - name: cloud-provider
            value: external
          - name: provider-id
            value: 'oci://{{ ds["id"] }}'
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta3
kind: OCIMachineTemplate
metadata:
  namespace: "${NAMESPACE}"
  name: "${CLUSTER_NAME}-control-plane"
spec:
  template:
    spec:
      imageId: "${OCI_IMAGE_ID}"
      compartmentId: "${OCI_COMPARTMENT_ID}"
      shape: "${OCI_CONTROL_PLANE_MACHINE_TYPE=VM.Standard.E4.Flex}"
      shapeConfig:
        ocpus: "${OCI_CONTROL_PLANE_MACHINE_TYPE_OCPUS=1}"
      metadata:
        ssh_authorized_keys: "${OCI_SSH_KEY}"
      isPvEncryptionInTransitEnabled: ${OCI_CONTROL_PLANE_PV_TRANSIT_ENCRYPTION=true}
      instanceOptions:
        areLegacyImdsEndpointsDisabled: true
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachinePool
metadata:
  name: ${CLUSTER_NAME}-mp-0
  namespace: "${NAMESPACE}"
spec:
  clusterName: ${CLUSTER_NAME}
  replicas: ${NODE_MACHINE_COUNT}
  template:
    spec:
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfig
          name: ${CLUSTER_NAME}-mp-0
      clusterName: ${CLUSTER_NAME}
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: OCIMachinePool
        name: ${CLUSTER_NAME}-mp-0
      version: ${KUBERNETES_VERSION}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta3
kind: OCIMachinePool
metadata:
  name: ${CLUSTER_NAME}-mp-0
  namespace: "${NAMESPACE}"
spec:
  instanceConfiguration:
    instanceOptions:
      areLegacyImdsEndpointsDisabled: true
    instanceSourceViaImageConfig:
      imageId: "${OCI_IMAGE_ID}"
    shape: "${OCI_NODE_MACHINE_TYPE=VM.Standard.E4.Flex}"
    shapeConfig:
      ocpus: "${OCI_NODE_MACHINE_TYPE_OCPUS=1}"
    metadata:
      ssh_authorized_keys: "${OCI_SSH_KEY}"

# uncomment to assign a public IP address once you setup the VCN to allow public ips
#  vnicAssignPublicIp: true
#  uncomment if you want to set a specific availability domain
#  placementDetails:
#      - availabilityDomain: 1
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfig
metadata:
  namespace: "${NAMESPACE}"
  name: "${CLUSTER_NAME}-mp-0"
spec:
  joinConfiguration:
    nodeRegistration:
      kubeletExtraArgs:
        - name: cloud-provider
          value: external
        - name: provider-id
          value: 'oci://{{ ds["id"] }}'
